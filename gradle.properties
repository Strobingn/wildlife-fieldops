# Gradle settings — sized for the sandbox's real 3GB cgroup cap.
# Peak budget: Gradle daemon (1536m heap + 384m metaspace + native) plus
# Kotlin compile daemon (1g) plus one dex worker must stay under ~3GB.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=384m
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Kotlin settings
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1g
