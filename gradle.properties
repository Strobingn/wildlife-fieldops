# Gradle settings — tuned to survive 4GB sandboxes; still fine on CI runners.
# (Was -Xmx4096m + parallel, which OOM-killed the daemon during compileDebugKotlin.)
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35

# Kotlin settings
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m
