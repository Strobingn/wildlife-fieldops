name: Deploy Web App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '22'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test --if-present
        continue-on-error: true

  build:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment:
      name: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Build Dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            ~/.npm
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-build-

      - name: Install Dependencies
        run: npm ci

      - name: Set Environment Variables
        run: |
          if [ "${{ github.event.inputs.environment }}" == "production" ] || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]; then
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "VITE_APP_ENV=production" >> $GITHUB_ENV
          else
            echo "NODE_ENV=staging" >> $GITHUB_ENV
            echo "VITE_APP_ENV=staging" >> $GITHUB_ENV
          fi
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> .env
          echo "VITE_OPENWEATHER_API_KEY=${{ secrets.VITE_OPENWEATHER_API_KEY }}" >> .env
          echo "VITE_GOOGLE_API_KEY=${{ secrets.VITE_GOOGLE_API_KEY }}" >> .env
          echo "VITE_GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.VITE_GOOGLE_CALENDAR_CLIENT_ID }}" >> .env

      - name: Build Application
        run: npm run build
        env:
          NODE_ENV: ${{ env.NODE_ENV }}
          VITE_APP_ENV: ${{ env.VITE_APP_ENV }}

      - name: Verify Build Output
        run: |
          echo "=== Build Output ==="
          ls -la dist/
          echo ""
          echo "=== JS Assets ==="
          ls -la dist/assets/*.js 2>/dev/null || echo "No JS assets in dist/assets/"
          echo ""
          echo "=== CSS Assets ==="
          ls -la dist/assets/*.css 2>/dev/null || echo "No CSS assets in dist/assets/"
          echo ""
          echo "=== Total Size ==="
          du -sh dist/ || true

      - name: Check Bundle Size
        run: |
          echo "=== Bundle Size Analysis ==="
          find dist/assets -name "*.js" -exec ls -lh {} \; | awk '{ print $5 ": " $9 }'
          echo ""
          TOTAL_SIZE=$(du -sb dist/ | cut -f1)
          echo "Total build size: $(numfmt --to=iec $TOTAL_SIZE)"
          # Warning if over 5MB
          if [ $TOTAL_SIZE -gt 5242880 ]; then
            echo "::warning::Build size exceeds 5MB. Consider code splitting or lazy loading."
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_number }}
          path: dist/
          retention-days: 7

  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ github.run_number }}
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: cloudflare
      url: ${{ steps.cf-deploy.outputs.url }}
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ github.run_number }}
          path: dist/

      - name: Deploy to Cloudflare Pages
        id: cf-deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: wildlife-fieldops
          directory: dist/
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  purge-cache:
    name: Purge CDN Cache
    runs-on: ubuntu-latest
    needs: [deploy-github-pages, deploy-cloudflare]
    if: always() && (needs.deploy-github-pages.result == 'success' || needs.deploy-cloudflare.result == 'success')
    steps:
      - name: Purge Cloudflare Cache
        if: needs.deploy-cloudflare.result == 'success'
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true
        continue-on-error: true

      - name: Notify Deployment Complete
        run: |
          echo "🚀 Deployment complete!"
          echo "Environment: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}"
          echo "Commit: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
