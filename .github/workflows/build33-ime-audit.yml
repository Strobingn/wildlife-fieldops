name: Build 33 IME Layout Audit

on:
  push:
    branches: [ feature/build-33-ai-operations ]
    paths:
      - '.github/workflows/build33-ime-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-ime-layouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-33-ai-operations
          fetch-depth: 0

      - name: Patch editable Compose screens
        shell: python
        run: |
          from pathlib import Path

          root = Path('app/src/main/java/com/strobingn/wildlifefieldops/ui/screens')
          targets = [
              'JobFormScreen.kt',
              'CustomerFormScreen.kt',
              'InspectionFormScreen.kt',
              'EstimateScreen.kt',
              'InvoiceScreen.kt',
              'ExpenseScreen.kt',
              'InventoryScreen.kt',
              'RouteOptimizerScreen.kt',
              'AIAssistantScreen.kt',
          ]

          changed = []
          for name in targets:
              path = root / name
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # Root Scaffold content containers: insert IME padding after scaffold padding.
              if '.imePadding()' not in text:
                  text = text.replace(
                      '.fillMaxSize()\n                .padding(padding)\n',
                      '.fillMaxSize()\n                .padding(padding)\n                .imePadding()\n',
                      1,
                  )
                  text = text.replace(
                      '.fillMaxSize().padding(padding)',
                      '.fillMaxSize().padding(padding).imePadding()',
                      1,
                  )

              # Editable AlertDialog bodies need their own keyboard-safe scrolling.
              if 'AlertDialog(' in text and ('OutlinedTextField(' in text or 'TextField(' in text):
                  marker = 'Column(verticalArrangement = Arrangement.spacedBy('
                  if marker in text and 'Column(modifier = Modifier.imePadding().verticalScroll(rememberScrollState())' not in text:
                      text = text.replace(
                          marker,
                          'Column(modifier = Modifier.imePadding().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(',
                          1,
                      )
                      if 'import androidx.compose.foundation.rememberScrollState' not in text:
                          anchor = 'import androidx.compose.foundation.layout.*\n'
                          text = text.replace(anchor, anchor + 'import androidx.compose.foundation.rememberScrollState\n', 1)
                      if 'import androidx.compose.foundation.verticalScroll' not in text:
                          anchor = 'import androidx.compose.foundation.rememberScrollState\n'
                          text = text.replace(anchor, anchor + 'import androidx.compose.foundation.verticalScroll\n', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # MainActivity edge-to-edge handling.
          main = Path('app/src/main/java/com/strobingn/wildlifefieldops/MainActivity.kt')
          text = main.read_text(encoding='utf-8')
          original = text
          if 'import androidx.core.view.WindowCompat' not in text:
              text = text.replace(
                  'import androidx.core.splashscreen.SplashScreen.Companion.installSplashScreen\n',
                  'import androidx.core.splashscreen.SplashScreen.Companion.installSplashScreen\nimport androidx.core.view.WindowCompat\n',
                  1,
              )
          if 'WindowCompat.setDecorFitsSystemWindows(window, false)' not in text:
              text = text.replace(
                  'super.onCreate(savedInstanceState)\n',
                  'super.onCreate(savedInstanceState)\n        WindowCompat.setDecorFitsSystemWindows(window, false)\n',
                  1,
              )
          if text != original:
              main.write_text(text, encoding='utf-8')
              changed.append(str(main))

          # Manifest keyboard resize policy.
          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          original = text
          if 'android:windowSoftInputMode="adjustResize"' not in text:
              text = text.replace(
                  'android:theme="@style/Theme.WildlifeFieldOps.Splash"',
                  'android:theme="@style/Theme.WildlifeFieldOps.Splash"\n            android:windowSoftInputMode="adjustResize"',
                  1,
              )
          if text != original:
              manifest.write_text(text, encoding='utf-8')
              changed.append(str(manifest))

          print('Changed files:')
          for item in changed:
              print(f' - {item}')

      - name: Verify every editable screen is IME-safe
        shell: python
        run: |
          from pathlib import Path
          root = Path('app/src/main/java/com/strobingn/wildlifefieldops/ui/screens')
          failures = []
          for path in root.glob('*.kt'):
              text = path.read_text(encoding='utf-8')
              editable = 'OutlinedTextField(' in text or 'BasicTextField(' in text or 'TextField(' in text
              if editable and '.imePadding()' not in text:
                  failures.append(str(path))
          if failures:
              raise SystemExit('Editable screens missing imePadding:\n' + '\n'.join(failures))

          main = Path('app/src/main/java/com/strobingn/wildlifefieldops/MainActivity.kt').read_text(encoding='utf-8')
          assert 'WindowCompat.setDecorFitsSystemWindows(window, false)' in main
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'android:windowSoftInputMode="adjustResize"' in manifest

      - name: Commit patched layouts
        run: |
          if git diff --quiet; then
            echo "No layout changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/strobingn/wildlifefieldops app/src/main/AndroidManifest.xml
          git commit -m "build33: make all editable screens keyboard safe"
          git push origin HEAD:feature/build-33-ai-operations
