name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent duplicate runs on rapid pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm ci --prefer-offline --no-audit --no-fund

      - name: Inject environment variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
        run: |
          echo "Checking secrets..."
          if [ -n "$VITE_SUPABASE_URL" ]; then echo "Supabase URL: OK"; else echo "Supabase URL: MISSING (offline mode)"; fi
          if [ -n "$VITE_GOOGLE_MAPS_API_KEY" ]; then echo "Google Maps: OK"; else echo "Google Maps: MISSING (offline mode)"; fi
          if [ -n "$VITE_OPENWEATHER_API_KEY" ]; then echo "Weather: OK"; else echo "Weather: MISSING (optional)"; fi

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
        run: |
          echo "Building..."
          npm run build
          echo "Build complete. Output:"
          ls -la dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  build-android:
    name: Build Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Adding Android platform..."
            npx cap add android
          else
            echo "Android platform already exists"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject permissions into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
            echo "GPS permissions already present"
          else
            echo "Injecting GPS permissions..."
            sed -i 's|</manifest>||' "$MANIFEST"
            cat >> "$MANIFEST" << 'EOF'

          <!-- GPS / Geolocation permissions -->
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.CAMERA" />
          <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-feature android:name="android.hardware.location" android:required="false" />
          <uses-feature android:name="android.hardware.location.gps" android:required="false" />
          <uses-feature android:name="android.hardware.camera" android:required="false" />
          </manifest>
          EOF
            echo "Permissions injected successfully"
          fi
          echo "--- Manifest permissions ---"
          grep -E "uses-permission|uses-feature" "$MANIFEST" || echo "No permissions found"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-fieldops-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Summary
        run: |
          echo "========================================"
          echo "  BUILD COMPLETE"
          echo "========================================"
          echo "  Download your APK from:"
          echo "  Actions > This Run > Artifacts"
          echo "========================================"
