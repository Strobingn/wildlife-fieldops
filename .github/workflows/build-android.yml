name: Build Native Android APK (Debug)

on:
  push:
    branches:
      - main
      - WildlifeFieldApp
      - app-fixed-by-chatgptV4
      - chatGPTV5
      - feature/build-32-diagnostics
      - feature/build-33-ai-operations
  pull_request:
    branches:
      - main
      - WildlifeFieldApp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.x.ai/v1
      LLM_MODEL: grok-4.5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || \
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Verify AI configuration
        run: |
          if [ -z "${XAI_API_KEY}" ] && [ -z "${LLM_API_KEY}" ]; then
            echo "::warning::No direct AI API key configured; the APK will use offline AI fallbacks."
          else
            echo "Direct AI API configuration is present."
          fi

      - name: Clean
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
        timeout-minutes: 25

      - name: Android lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
        timeout-minutes: 25

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build Debug APK
        run: |
          set -o pipefail
          export GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dorg.gradle.daemon=false"
          export JAVA_OPTS="-Xmx4g"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
        timeout-minutes: 45

      - name: Verify APK
        run: test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-field-ops-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: warn
          retention-days: 7
