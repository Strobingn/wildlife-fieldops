name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Verify Capacitor CLI
        run: npx --package @capacitor/cli cap --version

      - name: Build Vite App
        run: npm run build

      - name: Add Android Platform If Missing
        run: |
          if [ ! -d "android" ]; then
            npx --package @capacitor/cli cap add android
          fi

      - name: Generate Android Assets
        run: |
          # Ensure icon.png exists (fallback to logo.png)
          if [ ! -f "assets/icon.png" ] && [ -f "assets/logo.png" ]; then
            echo "icon.png not found, using logo.png as fallback"
            cp assets/logo.png assets/icon.png
          fi

          if [ -f "assets/icon.png" ] && [ -f "assets/splash.png" ]; then
            npx capacitor-assets generate --android
          else
            echo "Missing assets/icon.png or assets/splash.png"
            exit 1
          fi

      - name: Sync Capacitor Android
        run: npx --package @capacitor/cli cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Print SHA Fingerprints
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-fieldops-apk
          path: android/app/build/outputs/apk/debug/*.apk
