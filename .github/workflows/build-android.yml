name: Build Native Android APK (Debug)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: https://api.x.ai/v1
      LLM_MODEL: grok-4.5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools extras;google;m2repository'

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Normalize AI configuration
        shell: bash
        run: |
          set -euo pipefail
          XAI_API_KEY="$(printf '%s' "${XAI_API_KEY:-}" | tr -d '\r\n' | xargs)"
          LLM_API_KEY="$(printf '%s' "${LLM_API_KEY:-}" | tr -d '\r\n' | xargs)"
          if [ -z "$XAI_API_KEY" ] && [ -n "$LLM_API_KEY" ]; then
            XAI_API_KEY="$LLM_API_KEY"
          fi
          echo "XAI_API_KEY=$XAI_API_KEY" >> "$GITHUB_ENV"
          echo "LLM_API_KEY=$LLM_API_KEY" >> "$GITHUB_ENV"
          echo "AI key characters: ${#XAI_API_KEY}"
          if [ "${#XAI_API_KEY}" -lt 10 ]; then
            echo "::warning::No usable xAI key. The APK will use offline ML and the Supabase fallback where configured."
          fi

      - name: Compile tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
        timeout-minutes: 20

      - name: Build Debug APK
        run: |
          set -o pipefail
          export GRADLE_OPTS="-Xmx6g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        timeout-minutes: 30

      - name: Verify APK exists
        run: test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-field-ops-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
