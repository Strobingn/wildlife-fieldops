name: Build Native Android APK (Rockstar)

on:
  push:
    branches: [ native-rockstar-compose, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          export GRADLE_OPTS="-Xmx6g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -500
        timeout-minutes: 15

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-rockstar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/outputs/
          retention-days: 1

      - name: Summary
        if: success()
        run: echo "Native Rockstar APK built successfully!"
