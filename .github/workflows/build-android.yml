name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject GPS permissions into AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Remove closing manifest tag, add permissions, close again
          sed -i 's|</manifest>||' "$MANIFEST"
          cat >> "$MANIFEST" << 'EOF'

          <!-- GPS / Geolocation permissions -->
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
          <uses-feature android:name="android.hardware.location" android:required="false" />
          <uses-feature android:name="android.hardware.location.gps" android:required="false" />
          </manifest>
          EOF
          echo "AndroidManifest.xml permissions injected:"
          grep -A6 "GPS" "$MANIFEST"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wildlife-fieldops-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
