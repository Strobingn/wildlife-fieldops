<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wildlife Whisperer FieldOps</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}

    :root{
      --bg:#05070a;
      --card:#0d1117;
      --card2:#111827;
      --border:#1f2937;
      --accent:#22c55e;
      --accent2:#15803d;
      --green:#22c55e;
      --text:#f3f4f6;
      --muted:#94a3b8;
    }

    html,body,#app{
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }

    .top{
      position:sticky;
      top:0;
      z-index:1000;
      background:var(--bg);
      border-bottom:1px solid var(--border);
      padding-top:max(12px,env(safe-area-inset-top));
      padding-left:14px;
      padding-right:14px;
      padding-bottom:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .menu,.drawer{
      position:fixed;
      top:0;
      left:-290px;
      width:270px;
      height:100vh;
      background:#07090d;
      border-right:1px solid var(--border);
      z-index:2000;
      transition:.25s;
      overflow-y:auto;
      padding:24px 14px 30px;
    }

    .menu.open,.drawer.open{left:0}

    .menu button,.drawer button{
      width:100%;
      margin-bottom:12px;
      border-radius:14px;
      padding:15px;
      text-align:left;
      font-size:15px;
      color:#fff;
      background:var(--card2);
      border:1px solid var(--border);
    }

    .wrap{padding:14px;padding-bottom:90px}

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      margin-bottom:18px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:15px;
      margin-bottom:14px;
    }

    .stat{font-size:30px;font-weight:800}
    .tiny{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.4}
    h2{margin-bottom:12px}

    input,select,textarea{
      width:100%;
      background:var(--card2);
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      margin-top:10px;
      color:#fff;
      font-size:15px;
      outline:none;
    }

    textarea{min-height:120px;resize:vertical}

    button.action{
      width:100%;
      border:1px solid #166534;
      border-radius:14px;
      padding:15px;
      margin-top:12px;
      background:var(--accent2);
      color:#fff;
      font-size:15px;
      font-weight:800;
    }

    .menuButton{
      width:46px!important;
      height:46px!important;
      margin:0!important;
      padding:0!important;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--card2)!important;
      border:1px solid var(--border)!important;
      color:#fff!important;
      font-size:22px!important;
    }

    button.dark{background:var(--card2)!important;border:1px solid var(--border)!important}
    button.green{background:var(--accent2)!important}

    .pill{
      display:inline-block;
      background:var(--card2);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      margin-right:6px;
      margin-top:8px;
      font-size:12px;
    }

    .job{margin-top:12px}
    .job h3{margin-bottom:8px}

    .row{display:flex;gap:10px;margin-top:12px}
    .row button,.row a{flex:1}

    .mapbtn{
      display:block;
      width:100%;
      text-align:center;
      text-decoration:none;
      background:var(--accent2);
      color:#fff;
      padding:14px;
      border-radius:14px;
      margin-top:12px;
      font-weight:800;
      border:1px solid #166534;
    }

    .service{
      padding:12px;
      border-radius:14px;
      background:var(--card2);
      border:1px solid var(--border);
      margin-top:10px;
    }

    img.photo{
      width:100%;
      border-radius:14px;
      margin-top:10px;
      border:1px solid var(--border);
    }

    a{color:#22c55e}
  </style>
</head>

<body>
  <div id="menu" class="menu"></div>
  <div id="drawer" class="drawer"></div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
