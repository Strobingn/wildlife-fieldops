<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wildlife Whisperer FieldOps</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --card: #12121a;
      --card2: #1a1a24;
      --border: #2a2a3a;
      --accent: #22c55e;
      --accent2: #15803d;
      --green: #22c55e;
      --blue: #3b82f6;
      --red: #ef4444;
      --yellow: #fbbf24;
      --text: #f8f8f8;
      --muted: #8a8a9e;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body, #app {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }

    .top {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding-top: max(12px, env(safe-area-inset-top));
      padding-left: 14px;
      padding-right: 14px;
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu, .drawer {
      position: fixed;
      top: 0;
      left: -290px;
      width: 270px;
      height: 100vh;
      background: var(--card2);
      border-right: 1px solid var(--border);
      z-index: 2000;
      transition: .25s;
      overflow-y: auto;
      padding: 24px 14px 30px;
    }

    .menu.open, .drawer.open { left: 0; }

    .menu button, .drawer button {
      width: 100%;
      margin-bottom: 12px;
      border-radius: 14px;
      padding: 15px;
      text-align: left;
      font-size: 15px;
      color: #fff;
      background: var(--card);
      border: 1px solid var(--border);
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      transition: var(--transition);
      cursor: pointer;
    }

    .menu button:hover, .drawer button:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateX(4px);
    }

    .menu button:active, .drawer button:active {
      transform: scale(0.98);
    }

    .wrap { padding: 14px; padding-bottom: 100px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    .card.stack { padding: 18px; }

    .stat { font-size: 30px; font-weight: 800; }
    .tiny { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.4; }
    h2 { margin-bottom: 12px; font-weight: 700; }
    h3 { margin-bottom: 10px; font-weight: 600; }

    input, select, textarea {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      transition: var(--transition);
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.15);
    }

    textarea { min-height: 120px; resize: vertical; }

    button.action {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.25);
    }

    button.action:hover {
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
      transform: translateY(-1px);
    }

    button.action:active {
      transform: scale(0.98);
    }

    button.action.dark {
      background: var(--card2) !important;
      border: 1px solid var(--border) !important;
      box-shadow: none !important;
    }

    button.action.blue {
      background: linear-gradient(135deg, var(--blue), #1d4ed8);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
    }

    button.action.red {
      background: linear-gradient(135deg, var(--red), #b91c1c);
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25);
    }

    button.action.yellow {
      background: linear-gradient(135deg, var(--yellow), #d97706);
      color: #000;
      box-shadow: 0 2px 8px rgba(251, 191, 36, 0.25);
    }

    .menuButton {
      width: 46px !important;
      height: 46px !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card2) !important;
      border: 1px solid var(--border) !important;
      color: #fff !important;
      font-size: 22px !important;
      border-radius: 12px !important;
      cursor: pointer;
      transition: var(--transition);
    }

    .menuButton:hover {
      background: rgba(255, 255, 255, 0.05) !important;
    }

    button.green { background: var(--accent2) !important; }

    .pill {
      display: inline-block;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      padding: 5px 10px;
      border-radius: 999px;
      margin-right: 6px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--accent);
      font-weight: 500;
      transition: var(--transition);
    }

    .pill.warn { background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.2); color: var(--yellow); }
    .pill.bad { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: var(--red); }
    .pill.info { background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.2); color: var(--blue); }
    .pill.muted { background: var(--card2); border-color: var(--border); color: var(--muted); }

    .job { margin-top: 12px; }
    .job h3 { margin-bottom: 8px; }

    .row { display: flex; gap: 10px; margin-top: 12px; }
    .row button, .row a { flex: 1; }

    .mapbtn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      margin-top: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      box-shadow: 0 2px 8px rgba(34, 197, 94, 0.25);
    }

    .mapbtn:hover {
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.35);
      transform: translateY(-1px);
    }

    .mapbtn:active { transform: scale(0.98); }

    .service {
      padding: 12px;
      border-radius: 14px;
      background: var(--card2);
      border: 1px solid var(--border);
      margin-top: 10px;
      transition: var(--transition);
    }

    .service:hover {
      border-color: #3a3a4a;
    }

    img.photo {
      width: 100%;
      border-radius: 14px;
      margin-top: 10px;
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    img.photo.lazy {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    img.photo.lazy.loaded {
      opacity: 1;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      background: rgba(26, 26, 36, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
      z-index: 1000;
      transition: var(--transition);
    }

    .bottom-nav button {
      font-size: 20px;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--muted);
      transition: var(--transition);
      cursor: pointer;
      border-radius: 12px;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }

    .bottom-nav button:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .bottom-nav button.active {
      color: var(--accent);
      background: rgba(34, 197, 94, 0.1);
    }

    .fab {
      position: fixed;
      bottom: calc(70px + env(safe-area-inset-bottom));
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      font-size: 28px;
      font-weight: 300;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.4);
      z-index: 1000;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }

    .fab:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
    }

    .fab:active { transform: scale(0.95); }

    .prog {
      width: 100%;
      height: 6px;
      background: var(--card2);
      border-radius: 999px;
      margin-top: 10px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .species-icon {
      font-size: 24px;
      margin-right: 8px;
    }

    .weather-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--card2);
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid var(--border);
    }

    .weather-card img {
      width: 40px;
      height: 40px;
    }

    #map {
      height: 400px;
      width: 100%;
      border-radius: 16px;
      margin-top: 12px;
      border: 1px solid var(--border);
      background: var(--card);
    }

    .pin {
      position: absolute;
      background: var(--accent2);
      color: #fff;
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      pointer-events: none;
      z-index: 10;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
    }

    .hcell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      transition: var(--transition);
    }

    .hcell:hover {
      border-color: #3a3a4a;
      transform: translateY(-1px);
    }

    .section {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 18px 0 10px;
      padding-left: 4px;
    }

    .job-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .job-header h3 {
      margin: 0;
      flex: 1;
    }

    .status-pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-pill.active { background: rgba(34, 197, 94, 0.15); color: var(--accent); border: 1px solid rgba(34, 197, 94, 0.2); }
    .status-pill.scheduled { background: rgba(59, 130, 246, 0.15); color: var(--blue); border: 1px solid rgba(59, 130, 246, 0.2); }
    .status-pill.closed { background: rgba(138, 138, 158, 0.15); color: var(--muted); border: 1px solid rgba(138, 138, 158, 0.2); }
    .status-pill.trapping { background: rgba(251, 191, 36, 0.15); color: var(--yellow); border: 1px solid rgba(251, 191, 36, 0.2); }
    .status-pill.repair { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.2); }

    .job-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .job-actions button {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }

    .job-actions button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }

    .job-actions button.secondary {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .job-actions button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .sync-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .search-box {
      position: sticky;
      top: calc(12px + env(safe-area-inset-top) + 50px);
      z-index: 900;
      background: rgba(10, 10, 15, 0.92);
      backdrop-filter: blur(8px);
      padding: 8px 0;
      margin-bottom: 8px;
    }

    @media (min-width: 768px) {
      .wrap { max-width: 700px; margin: 0 auto; }
    }
  </style>
</head>

<body>
  <div id="menu" class="menu"></div>
  <div id="drawer" class="drawer"></div>
  <div id="app"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
