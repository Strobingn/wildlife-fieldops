<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Wildlife Whisperer FieldOps</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      background:#08111b;
      color:#fff;
    }

    #app{
      min-height:100vh;
    }

    .top{
      position:sticky;
      top:0;
      z-index:1000;
      background:#101c2b;
      border-bottom:1px solid #203040;
      padding:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .menu{
      position:fixed;
      left:-280px;
      top:0;
      width:260px;
      height:100vh;
      background:#0e1724;
      transition:.25s;
      z-index:2000;
      padding:18px;
      overflow:auto;
    }

    .menu.open{
      left:0;
    }

    .menu button{
      width:100%;
      margin-bottom:10px;
      border:none;
      border-radius:14px;
      padding:14px;
      background:#18283a;
      color:#fff;
      font-size:15px;
      text-align:left;
    }

    .wrap{
      padding:14px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      margin-bottom:18px;
    }

    .card{
      background:#101b29;
      border:1px solid #223447;
      border-radius:18px;
      padding:14px;
      margin-bottom:14px;
    }

    .stat{
      font-size:28px;
      font-weight:bold;
    }

    .tiny{
      opacity:.7;
      font-size:12px;
      margin-top:6px;
    }

    input,
    select,
    textarea{
      width:100%;
      margin-top:10px;
      border:none;
      border-radius:12px;
      padding:14px;
      background:#152434;
      color:#fff;
      font-size:15px;
    }

    textarea{
      min-height:110px;
    }

    button.action{
      width:100%;
      border:none;
      border-radius:14px;
      padding:15px;
      margin-top:12px;
      background:#1e88ff;
      color:#fff;
      font-size:16px;
      font-weight:bold;
    }

    .pill{
      display:inline-block;
      padding:6px 10px;
      border-radius:999px;
      background:#1b2c40;
      margin-top:8px;
      margin-right:6px;
      font-size:12px;
    }

    .job{
      margin-top:12px;
    }

    .job h3{
      margin-bottom:8px;
    }

    .row{
      display:flex;
      gap:10px;
    }

    .row button{
      flex:1;
    }

    .mapbtn{
      display:block;
      width:100%;
      text-align:center;
      text-decoration:none;
      background:#18a558;
      color:#fff;
      padding:12px;
      border-radius:12px;
      margin-top:12px;
      font-weight:bold;
    }

    .service{
      padding:10px;
      background:#132233;
      border-radius:10px;
      margin-top:8px;
    }
  </style>
</head>

<body>

<div id="menu" class="menu"></div>

<div id="app"></div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
