<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wildlife Whisperer FieldOps</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
    body{background:#050505;color:#fff}
    #app{min-height:100vh;background:#050505}

    .top{
      position:sticky;
      top:0;
      z-index:1000;
      background:#050505;
      border-bottom:1px solid #1f1f1f;
      padding-top:max(10px,env(safe-area-inset-top));
      padding-left:14px;
      padding-right:14px;
      padding-bottom:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .menu{
      position:fixed;
      left:-280px;
      top:0;
      width:260px;
      height:100vh;
      background:#080808;
      transition:.25s;
      z-index:2000;
      padding:18px;
      overflow:auto;
      border-right:1px solid #222;
    }

    .menu.open{left:0}

    .menu button{
      width:100%;
      margin-bottom:10px;
      border:none;
      border-radius:14px;
      padding:14px;
      background:#151515;
      color:#fff;
      font-size:15px;
      text-align:left;
    }

    .wrap{padding:14px;padding-bottom:80px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
    .card{background:#101010;border:1px solid #242424;border-radius:18px;padding:14px;margin-bottom:14px}
    .stat{font-size:28px;font-weight:bold}
    .tiny{opacity:.72;font-size:12px;margin-top:6px}
    input,select,textarea{width:100%;margin-top:10px;border:none;border-radius:12px;padding:14px;background:#161616;color:#fff;font-size:15px}
    textarea{min-height:110px}
    button.action{width:100%;border:none;border-radius:14px;padding:15px;margin-top:12px;background:#1e88ff;color:#fff;font-size:16px;font-weight:bold}
    .menuButton{width:48px!important;height:44px!important;margin:0!important;padding:10px 14px!important;display:flex;align-items:center;justify-content:center}
    .green{background:#18a558!important}
    .dark{background:#191919!important}
    .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#1b1b1b;margin-top:8px;margin-right:6px;font-size:12px}
    .job{margin-top:12px}
    .job h3{margin-bottom:8px}
    .row{display:flex;gap:10px}
    .row button,.row a{flex:1}
    .mapbtn{display:block;width:100%;text-align:center;text-decoration:none;background:#18a558;color:#fff;padding:12px;border-radius:12px;margin-top:12px;font-weight:bold}
    .service{padding:10px;background:#151515;border:1px solid #262626;border-radius:10px;margin-top:8px}
    a{color:#77b7ff}
  </style>
</head>

<body>
  <div id="menu" class="menu"></div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
